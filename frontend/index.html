<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="assets/tierra.svg" type="image/png" style="height: 32px; width: 32px;">
    <title>TIMEZONE</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <!-- Buscar los iconos en font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css">
    <!-- Cargar fuentes de las letras desde los servidores de google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <img src="assets/tierra.svg" class="logo">
            <div class="logo-texto">
                <span class="time-word">TIME</span><br>
                <span class="zone-word">ZONE</span>
                <span class="com-word">.com</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a class="nav-item-active" id="inicio">INICIO<i class="fa-solid fa-house"></i></a></li>
            <li><a class="nav-item" id="reloj-mundial">RELOJ MUNDIAL<i class="fa-solid fa-map"></i></a></li>
            <li><a class="nav-item" id="alarmas">ALARMAS<i class="fa-solid fa-alarm-clock"></i></a></li>
        </ul>
    </nav>
    <section class="buscar">
        <div class="caja-buscar">
            <div class="icon-buscar" id="buscar">
                <i class="fas fa-search"></i>
            </div>
            <input type="text" placeholder="Buscar zona horaria..." id="searchCity" autocomplete="off">
            <button id="volver">Borrar búsqueda</button>
        </div>
    </section>
    <section class="cities-segmento1" id="cities-segmento1">
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Berlín</h2>
                <time class="reloj-tiempo" data-timezone="Europe/Berlin" datetime="20:00">20:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/berlin_noche.webp" alt="Vista panorámica de Berlín" loading="lazy">
            </figure>
        </article>
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Bogotá</h2>
                <time class="reloj-tiempo" data-timezone="America/Bogota" datetime="13:00">13:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/bogota_dia.webp" alt="Vista panorámica de Bogotá" loading="lazy">
            </figure>
        </article>
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Madrid</h2>
                <time class="reloj-tiempo" data-timezone="Europe/Madrid" datetime="20:00">20:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/madrid_noche.webp" alt="Vista panorámica de Madrid" loading="lazy">
            </figure>
        </article>
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Moscú</h2>
                <time class="reloj-tiempo" data-timezone="Europe/Moscow" datetime="20:00">21:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/moscu_noche.webp" alt="Vista panorámica de Moscú" loading="lazy">
            </figure>
        </article>
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Nueva York</h2>
                <time class="reloj-tiempo" data-timezone="America/New_York" datetime="20:00">14:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/NuevaYork_dia.webp" alt="Vista panorámica de Nueva York" loading="lazy">
            </figure>
        </article>
        <article class="tarjeta-reloj">
            <header class="tarjeta-encabezado">
                <h2>Sydney</h2>
                <time class="reloj-tiempo" data-timezone="Australia/Sydney" datetime="20:00">03:00</time>
            </header>
            <figure class="tarjeta-imagen">
                <img src="assets/sydney_noche.webp" alt="Vista panorámica de Sydney" loading="lazy">
            </figure>
        </article>
    </section>
    <section class="cities-resultado" id="cities-resultado">    
        
    </section>
    <footer>
        <div>
            <article class="footer1">
                <header class="datos-contacto">
                    <h2 class="footer-h2">DATOS DE CONTACTO DEL DESARROLLADOR</h2>
                    <img class="contacto" src="assets/CONTACTO.png" loading="lazy">
                </header>
            </article>
        </div>
        <div>
            <article class="footer2">
                <header class="worldmap">
                    <img class="Foto-final" src="assets/FOTOFINAL.jpg" loading="lazy">
                </header>
            </article>
        </div>
    </footer>
    <script src="js/animations.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
