<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="assets/tierra.svg" type="image/png" style="height: 32px; width: 32px;">
    <title>TIMEZONE - ALARMAS</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/alarmas.css">
    <!-- Buscar los iconos en font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css">
    <!-- Cargar fuentes de las letras desde los servidores de google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <img src="assets/tierra.svg" class="logo">
            <div class="logo-texto">
                <span class="time-word">TIME</span><br>
                <span class="zone-word">ZONE</span>
                <span class="com-word">.com</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a class="nav-item" id="inicio">INICIO<i class="fa-solid fa-house"></i></a></li>
            <li><a class="nav-item" id="reloj-mundial">RELOJ MUNDIAL<i class="fa-solid fa-map"></i></a></li>
            <li><a class="nav-item-active" id="alarmas">ALARMAS<i class="fa-solid fa-alarm-clock"></i></a></li>
        </ul>
    </nav>
    <section class="tempyalarm">
        <section class="nuevas-alarmas">
            <section class="alarma-mas" id="alarma-mas">
                <div class="caja-alarma" id="caja-alarma">
                    <div class="icon-alarma">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <p class="caja-alarma-texto">Agregar alarma</p>
                </div>
            </section>
            <section class="alarms" id="alarms">
            </section>
        </section>
        <section class="temporizador">
            <section class="temp">
                <div class="caja-temp">
                    <div class="icon-temp">
                        <i class="fa-solid fa-stopwatch"></i>
                    </div>
                    <p class="caja-temp-texto">TEMPORIZADOR</p>
                </div>
            </section>
            <section class="box-timer">
                <article class="timer">
                    <figure class="timer">
                        <time class="time-timer">0:47</time>
                    </figure>
                </article>
            </section>
            <section class="time-add">
                <article class="box-timer-add-left">
                    <figure class="add">
                        <time class="add-time-timer">+5</time>
                    </figure>
                </article>
                <article class="box-timer-add-center">
                    <figure class="add">
                        <time class="add-time-timer">+10</time>
                    </figure>
                </article>
                <article class="box-timer-add-right">
                    <figure class="add">
                        <time class="add-time-timer">+15</time>
                    </figure>
                </article>
            </section>
        </section>
    </section>
    <footer>
        <div>
            <article class="footer1">
                <header class="datos-contacto">
                    <h2 class="footer-h2">DATOS DE CONTACTO DEL DESARROLLADOR</h2>
                    <img class="contacto" src="assets/CONTACTO.png">
                </header>
            </article>
        </div>
        <div>
            <article class="footer2">
                <header class="worldmap">
                    <img class="Foto-final" src="assets/FOTOFINAL.jpg">
                </header>
            </article>
        </div>
    </footer>
    <script src="js/animations.js"></script>
    <script src="js/alarmas.js"></script>
</body>
</html>
